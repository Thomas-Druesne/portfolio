<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouvelle conversation - Thomas Druesne</title>
  <meta name="description" content="Posez vos questions à Thomas Druesne, Webdesigner UX &amp; Intégrateur WordPress : projets, compétences, parcours, book graphique, contact." />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&amp;display=swap" />
  <link rel="stylesheet" href="css/app.css?v=3" />
  <link rel="stylesheet" href="css/modal-inzerty.css?v=3" />
</head>
<body data-page="chat">

  <div class="app" id="app">

    <!-- La barre latérale est injectée ici par js/layout.js -->

    <!-- =====================================================
         CHAT CLASSIQUE — "Nouvelle conversation"
    ====================================================== -->
    <main class="chat is-chatting is-standalone" id="chat">

      <header class="chat-top">
        <button class="icon-btn" id="sidebar-open" type="button" aria-label="Ouvrir le menu" data-fr-aria="Ouvrir le menu" data-en-aria="Open menu">
          <span class="ico" data-icon="sidebar"></span>
        </button>
        <span class="chat-spacer"></span>
        <a href="chat.html" class="icon-btn" id="chat-new" data-action="new" aria-label="Nouvelle conversation" data-fr-aria="Nouvelle conversation" data-en-aria="New chat">
          <span class="ico" data-icon="newchat"></span>
        </a>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-col">
          <h1 class="sr-only" data-fr="Nouvelle conversation avec Thomas" data-en="New chat with Thomas">Nouvelle conversation avec Thomas</h1>
          <!-- Fil de la conversation (rempli par js/app.js) -->
          <div class="thread" id="thread" aria-live="polite"></div>
        </div>
      </div>

      <!-- Barre de saisie -->
      <div class="composer-wrap">
        <div class="chat-col">
          <div class="suggestions" id="suggestions">
            <button type="button" class="chip" data-topic="projets"><span class="ico" data-icon="folder"></span><span data-fr="Tes projets ?" data-en="Your projects?">Tes projets ?</span></button>
            <button type="button" class="chip" data-topic="competences"><span class="ico" data-icon="pen"></span><span data-fr="Tes compétences ?" data-en="Your skills?">Tes compétences ?</span></button>
            <button type="button" class="chip" data-topic="parcours"><span class="ico" data-icon="route"></span><span data-fr="Ton parcours ?" data-en="Your background?">Ton parcours ?</span></button>
            <button type="button" class="chip" data-topic="book"><span class="ico" data-icon="book"></span><span data-fr="Ton book ?" data-en="Your portfolio?">Ton book ?</span></button>
            <button type="button" class="chip" data-topic="contact"><span class="ico" data-icon="mail"></span><span data-fr="Te contacter ?" data-en="Contact you?">Te contacter ?</span></button>
          </div>

          <form class="composer" id="composer" autocomplete="off">
            <label for="prompt" class="sr-only" data-fr="Votre question" data-en="Your question">Votre question</label>
            <textarea id="prompt" rows="1"
              placeholder="Écrivez votre question…"
              data-fr-placeholder="Écrivez votre question…"
              data-en-placeholder="Type your question…"></textarea>
            <button class="send-btn" type="submit" aria-label="Envoyer" data-fr-aria="Envoyer" data-en-aria="Send" disabled>
              <span class="ico" data-icon="send"></span>
            </button>
          </form>

          <p class="composer-note" data-fr="Thomas répond sur ses projets, ses compétences, son parcours, son book et ses coordonnées. Pour le reste, il improvise." data-en="Thomas answers about his projects, skills, background, portfolio and contact details. For anything else, he improvises.">Thomas répond sur ses projets, ses compétences, son parcours, son book et ses coordonnées. Pour le reste, il improvise.</p>
        </div>
      </div>

    </main>
  </div>

  <script src="js/layout.js?v=3"></script>
  <script src="js/answers.js?v=3"></script>
  <script src="js/icons.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
