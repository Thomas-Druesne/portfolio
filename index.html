<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Thomas Druesne</title>
  <meta name="description" content="Thomas Druesne — Webdesigner UX &amp; Intégrateur WordPress. Projets, book graphique, compétences, parcours et outils." />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <!-- Thème : appliqué avant l'affichage pour éviter un flash (dark par défaut) -->
  <script>try { if (localStorage.getItem("portfolio-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&amp;display=swap" />
  <link rel="stylesheet" href="css/app.css?v=14" />
</head>
<body data-page="home">

  <div class="app" id="app">

    <!-- =====================================================
         ZONE PRINCIPALE — interface de chat
    ====================================================== -->
    <main class="chat" id="chat">

      <header class="chat-top">
        <button class="icon-btn" id="sidebar-open" type="button" aria-label="Ouvrir le menu" data-fr-aria="Ouvrir le menu" data-en-aria="Open menu">
          <span class="ico" data-icon="sidebar"></span>
        </button>
        <span class="chat-spacer"></span>
        <a href="chat.html" class="icon-btn" id="chat-new" data-action="new" aria-label="Nouvelle conversation" data-fr-aria="Nouvelle conversation" data-en-aria="New chat">
          <span class="ico" data-icon="newchat"></span>
        </a>
        <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="Passer en mode clair">
          <span class="ico ico-sun" data-icon="sun"></span>
          <span class="ico ico-moon" data-icon="moon"></span>
        </button>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-col">

          <!-- Accueil -->
          <section class="welcome" id="welcome">
            <div class="photo-particles" id="photo-particles">
              <img class="photo-static" id="photo-static" src="img/photo_hero_section_homepage.png" alt="Thomas Druesne" />
              <canvas id="photo-canvas" aria-hidden="true"></canvas>
            </div>
            <h1 class="welcome-title">
              <span data-fr="Bonjour, je suis Thomas," data-en="Hello, I'm Thomas,">Bonjour, je suis Thomas,</span>
              <span class="accent" data-fr="que puis-je pour vous aujourd'hui ?" data-en="how can I help you today?">que puis-je pour vous aujourd'hui ?</span>
            </h1>
          </section>

          <!-- Fil de la conversation (rempli par js/app.js) -->
          <div class="thread" id="thread" aria-live="polite"></div>

        </div>
      </div>

      <!-- Barre de saisie -->
      <div class="composer-wrap">
        <div class="chat-col">
          <form class="composer" id="composer" autocomplete="off">
            <label for="prompt" class="sr-only" data-fr="Votre question" data-en="Your question">Votre question</label>
            <textarea id="prompt" rows="1"
              placeholder="Posez-moi une question sur mes projets, mon parcours…"
              data-fr-placeholder="Posez-moi une question sur mes projets, mon parcours…"
              data-en-placeholder="Ask me about my projects, my background…"></textarea>
            <button class="send-btn" type="submit" aria-label="Envoyer" data-fr-aria="Envoyer" data-en-aria="Send" disabled>
              <span class="ico" data-icon="send"></span>
            </button>
          </form>

          <div class="suggestions" id="suggestions">
            <button type="button" class="chip" data-topic="projets"><span class="ico" data-icon="folder"></span><span data-fr="Voir mes projets" data-en="See my projects">Voir mes projets</span></button>
            <button type="button" class="chip" data-topic="competences"><span class="ico" data-icon="pen"></span><span data-fr="Mes compétences" data-en="My skills">Mes compétences</span></button>
            <button type="button" class="chip" data-topic="parcours"><span class="ico" data-icon="route"></span><span data-fr="Mon parcours" data-en="My background">Mon parcours</span></button>
            <button type="button" class="chip" data-topic="book"><span class="ico" data-icon="book"></span><span data-fr="Mon book" data-en="My portfolio">Mon book</span></button>
            <button type="button" class="chip" data-topic="contact"><span class="ico" data-icon="mail"></span><span data-fr="Me contacter" data-en="Contact me">Me contacter</span></button>
          </div>

          <p class="composer-note" data-fr="Les réponses sont écrites par Thomas lui-même, aucune IA n'a été maltraitée." data-en="Answers are written by Thomas himself, no AI was harmed.">Les réponses sont écrites par Thomas lui-même, aucune IA n'a été maltraitée.</p>
        </div>
      </div>

    </main>
  </div>


  <script src="js/layout.js?v=14"></script>
  <script src="js/answers.js?v=14"></script>
  <script src="js/icons.js?v=14"></script>
  <script src="js/particles.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
